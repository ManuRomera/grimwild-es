name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validar etiqueta y manifiesto
        run: |
          version=$(node -p "require('./system.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "La etiqueta $GITHUB_REF_NAME no coincide con system.json ($version)"; exit 1; }
          grep -q "releases/download/$GITHUB_REF_NAME/grimwild.zip" system.json || { echo "download de system.json no apunta a $GITHUB_REF_NAME"; exit 1; }
      - run: npm run check
      - run: npm test
      - name: Empaquetar
        run: |
          mkdir -p dist
          zip -r dist/grimwild.zip system.json module templates styles lang assets packs vue lib LICENSE NOTICE.md README.md CHANGELOG.md -x "packs/*/LOCK" "packs/*/LOG*"
          cp system.json dist/system.json
          unzip -l dist/grimwild.zip | tail -1
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{p=1;next} /^## /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md || echo "Versión $version." > dist/notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/grimwild.zip dist/system.json --title "Grimwild ES $GITHUB_REF_NAME" --notes-file dist/notas.md
